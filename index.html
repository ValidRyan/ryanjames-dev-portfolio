    $('[data-fo-reset]',body).onclick=()=>{fo.root=makeFolder('Store');fo.selected=fo.root.id;fo.open=new Set([fo.root.id]);render();};render();}
  const SAP_WORDS=['Phrase','Limits','Meaning','Goals','Respond','Understanding','Info','Knowledge'];
  const sap={library:new Map(),modified:0,log:[]};
  function sapLine(text,indent=0){const el=document.createElement('div');el.className='sap-line';el.dataset.indent=String(indent);el.style.setProperty('--indent',indent);el.textContent=text||'';if(!text)el.appendChild(document.createElement('br'));return el;}
  function sapLines(editor){return $$('.sap-line',editor).map((el)=>({el,text:el.textContent.replace(/\u200b/g,''),indent:Math.max(0,Number(el.dataset.indent)||0)}));}
  function sapKind(text){const t=text.trim();if(!t)return'blank';if(/^(#|\/\/)/.test(t))return'comment';if(SAP_WORDS.some((w)=>new RegExp('^'+w+'(?:\\s*:|\\s+|$)','i').test(t)))return'instruction';return'noise';}
  function sapRefs(text){const refs=[];let m;const re=/\[(?:ref|reference)\s*:\s*([^\]]+)\]|@([^\s,;]+)/gi;while((m=re.exec(text)))refs.push((m[1]||m[2]).trim());return refs;}
  function sapKey(item){return item.path.replace(/^sample\/write_demo\//,'').toLowerCase();}
  function safeRef(raw,basePath=''){const value=String(raw).replace(/\\/g,'/').trim();if(!value||/^\/{1,2}|^[a-z]:/i.test(value))return{state:'blocked',note:'absolute path'};if(/[<>:\"|?*\u0000-\u001f]/.test(value))return{state:'blocked',note:'illegal character'};const pieces=(basePath?basePath.split('/').slice(0,-1):[]).concat(value.split('/')),out=[];for(const p of pieces){if(!p||p==='.')continue;if(p==='..')return{state:'blocked',note:'traversal'};if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(p))return{state:'blocked',note:'device name'};out.push(p);}return{state:'ok',path:out.join('/')};}
  function refsInEntry(entry){if(!entry)return{refs:[]};if(/\.mwrite$/i.test(entry.path)){try{const value=JSON.parse(entry.content),paragraphs=Array.isArray(value.paragraphs)?value.paragraphs:null;if(!paragraphs)return{refs:[],structural:true};return{refs:paragraphs.flatMap((p)=>sapRefs((p.runs||[]).map((r)=>r.text||'').join('')))};}catch(e){return{refs:[],structural:true};}}return{refs:sapRefs(entry.content||'')};}
  function resolveSap(raw,basePath,trail,budget){if(budget.count++>=200)return{label:raw,state:'truncated',children:[]};const safe=safeRef(raw,basePath);if(safe.state!=='ok')return{label:raw,state:'blocked',children:[]};const key=safe.path.toLowerCase();if(trail.has(key))return{label:safe.path,state:'cycle',children:[]};const entry=sap.library.get(key);if(!entry){const folderEntries=Array.from(sap.library.values()).filter((x)=>x.key.startsWith(key+'/'));if(folderEntries.length)return{label:safe.path,state:'ok',children:folderEntries.map((x)=>({label:x.path,state:'ok',children:[]}))};return{label:safe.path,state:'broken',children:[]};}const detail=refsInEntry(entry);if(detail.structural)return{label:entry.path,state:'structural',children:[]};const next=new Set(trail);next.add(key);return{label:entry.path,state:'ok',children:detail.refs.map((r)=>resolveSap(r,entry.key,next,budget))};}
  function sapTreeNode(n){return'<li><div class="sap-node"><span>'+escapeHTML(n.label)+'</span><span class="state '+n.state+'">'+n.state+'</span></div>'+(n.children&&n.children.length?'<ul>'+n.children.map(sapTreeNode).join('')+'</ul>':'')+'</li>';}
  function parseMwrite(text){const value=JSON.parse(text);if(value.version!==1||!Array.isArray(value.paragraphs))throw new Error('Invalid .mwrite document.');return value.paragraphs.map((p)=>({text:(p.runs||[]).map((r)=>r.text||'').join(''),indent:Math.max(0,Number(p.indent)||0)}));}
  function currentSapLine(editor){const sel=getSelection();if(!sel.rangeCount)return null;let n=sel.anchorNode;while(n&&n!==editor){if(n.nodeType===1&&n.classList.contains('sap-line'))return n;n=n.parentNode;}return null;}
  function openSAP(){const body=document.createElement('div');body.className='app-window';body.innerHTML='<div class="app-menu"><button class="button primary" data-sap-open>Open .mwrite</button><button class="button" data-sap-library>Add references</button><button class="button" data-sap-save>Save</button><button class="button" data-sap-reset>Reset</button></div><div class="sap-grid"><section class="sap-left"><div class="sap-stats" data-sap-stats></div><div class="sap-tools"><button class="button" data-cmd="bold"><b>B</b></button><button class="button" data-cmd="line">Line</button><button class="button" data-cmd="dash">Dash</button><button class="button" data-cmd="italic"><i>I</i></button><button class="button" data-cmd="spread">Spread</button><button class="button" data-cmd="narrow">Narrow</button><button class="button" data-cmd="embed">Embed</button><button class="button" data-cmd="unembed">Un-embed</button><button class="button" data-cmd="indent">Indent</button><button class="button" data-cmd="outdent">Outdent</button><button class="button primary" data-sap-run>Run</button></div><div class="sap-editor" data-sap-editor contenteditable="true" spellcheck="true" aria-label="SAP editor"></div></section><section class="sap-right"><div class="sap-tree" data-sap-tree></div><pre class="sap-log" data-sap-log>Run log: press Run.</pre></section></div>';openWindow('SAP Modifier',body);const editor=$('[data-sap-editor]',body);
    const setLines=(lines)=>{editor.innerHTML='';(lines.length?lines:[{text:'',indent:0}]).forEach((x)=>editor.appendChild(sapLine(x.text,x.indent)));update(false);};
    const update=(changed)=>{const lines=sapLines(editor),counts={instruction:0,noise:0,comment:0};lines.forEach((l)=>{const k=sapKind(l.text);l.el.dataset.kind=k;l.el.style.setProperty('--indent',l.indent);if(counts[k]!=null)counts[k]++;});if(changed)sap.modified++;$('[data-sap-stats]',body).innerHTML='<span>Clarity: <b>'+counts.instruction+'</b></span><span>Noise: <b>'+counts.noise+'</b></span><span>Comment: <b>'+counts.comment+'</b></span><span>Modifications: <b>'+sap.modified+'</b></span>';const scope={label:'Document',state:'scope',children:[]},stack=[{indent:-1,node:scope}],diagnostics=[];lines.forEach((l,i)=>{if(i&&l.indent>lines[i-1].indent+1)diagnostics.push('Line '+(i+1)+': indent jump');if(i&&l.indent>lines[i-1].indent&&['blank','comment'].includes(sapKind(lines[i-1].text)))diagnostics.push('Line '+(i+1)+': invalid parent');while(stack.length>1&&stack.at(-1).indent>=l.indent)stack.pop();const n={label:l.text.trim()||'(blank)',state:sapKind(l.text),children:[]};stack.at(-1).node.children.push(n);stack.push({indent:l.indent,node:n});});const refs=lines.flatMap((l)=>sapRefs(l.text)),budget={count:0};let html='<ul>'+sapTreeNode(scope)+'</ul>';if(refs.length)html+='<div class="section-label">References</div><ul>'+refs.map((r)=>sapTreeNode(resolveSap(r,'',new Set(),budget))).join('')+'</ul>';if(diagnostics.length)html+='<div class="error">'+diagnostics.map(escapeHTML).join('<br>')+'</div>';$('[data-sap-tree]',body).innerHTML=html;};
    const addLibrary=async(items)=>{for(const item of items){try{const content=await fetchText(item.path),key=sapKey(item);sap.library.set(key,{key,path:key,content,item});}catch(e){toast(e.message);}}update(false);};
    $('[data-sap-open]',body).onclick=async()=>{const chosen=await pickSamples({title:'SAP Modifier — Open',extensions:['.mwrite'],multiple:false});if(!chosen[0])return;try{const text=await fetchText(chosen[0].path);await addLibrary([chosen[0]]);setLines(parseMwrite(text));sap.modified=0;update(false);}catch(e){toast(e.message);}};
    $('[data-sap-library]',body).onclick=async()=>addLibrary(await pickSamples({title:'SAP Modifier — Add references',extensions:['.mwrite','.mdoc','.mprog','.txt'],multiple:true}));
    $('[data-sap-save]',body).onclick=()=>{const payload={version:1,paragraphs:sapLines(editor).map((l)=>({indent:l.indent,runs:[{text:l.text}]}))};download('document.mwrite',JSON.stringify(payload,null,1),'application/json');sap.modified=0;update(false);};
    $('[data-sap-reset]',body).onclick=()=>{sap.library.clear();sap.modified=0;setLines([{text:'',indent:0}]);$('[data-sap-log]',body).textContent='Run log: press Run.';};
    $('[data-sap-run]',body).onclick=()=>{const instructions=sapLines(editor).filter((l)=>sapKind(l.text)==='instruction');$('[data-sap-log]',body).textContent=instructions.length?instructions.map((l,i)=>(i+1)+'. '+l.text.trim()+' — not implemented yet').join('\n'):'No instructions found.';};
    $$('[data-cmd]',body).forEach((b)=>b.onclick=async()=>{const cmd=b.dataset.cmd;editor.focus();if(cmd==='bold'||cmd==='italic'||cmd==='line'){document.execCommand(cmd==='line'?'underline':cmd);update(true);return;}const line=currentSapLine(editor);if(cmd==='indent'||cmd==='outdent'){if(!line)return toast('Place the cursor on a line.');const n=Math.max(0,(Number(line.dataset.indent)||0)+(cmd==='indent'?1:-1));line.dataset.indent=n;line.style.setProperty('--indent',n);update(true);return;}if(cmd==='unembed'){if(!line)return toast('Place the cursor on a line.');line.textContent=line.textContent.replace(/\[(?:ref|reference)\s*:\s*[^\]]+\]|@[^\s,;]+/gi,'').trim();update(true);return;}if(cmd==='embed'){const chosen=await pickSamples({title:'SAP Modifier — Embed',extensions:['.mwrite','.mdoc','.mprog','.txt'],multiple:false});if(!chosen[0])return;await addLibrary(chosen);const target=currentSapLine(editor)||sapLines(editor).at(-1).el;target.textContent+=(target.textContent?' ':'')+'@'+sapKey(chosen[0]);update(true);return;}const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return toast('Select text first.');const range=sel.getRangeAt(0),span=document.createElement('span');span.className=cmd==='dash'?'dash-text':cmd==='spread'?'spread-text':'';if(cmd==='narrow'){const parent=sel.anchorNode.parentElement&&sel.anchorNode.parentElement.closest('.spread-text');if(parent)parent.replaceWith(...parent.childNodes);update(true);return;}try{range.surroundContents(span);update(true);}catch(e){toast('Select text within one line.');}});
    editor.oninput=()=>update(true);editor.onpaste=(e)=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));};editor.onkeydown=(e)=>{if(e.key==='Tab'){e.preventDefault();const line=currentSapLine(editor);if(line){const n=Math.max(0,(Number(line.dataset.indent)||0)+(e.shiftKey?-1:1));line.dataset.indent=n;line.style.setProperty('--indent',n);update(true);}return;}if(e.key==='Enter'){e.preventDefault();const line=currentSapLine(editor),next=sapLine('',line?Number(line.dataset.indent)||0:0);line?line.after(next):editor.appendChild(next);const range=document.createRange();range.setStart(next,0);range.collapse(true);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);update(true);}};setLines([{text:'',indent:0}]);}
})();
